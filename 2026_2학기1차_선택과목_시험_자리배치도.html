<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2학기 1차 자리배치도</title>
<style>
  :root{--navy:#312E81;--ink:#1E293B;--muted:#64748B;--border:#CBD5E1;--bg:#EEF2FF;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:var(--bg);color:var(--ink);}
  body,header,.phead,.podium,.seat,.seat .badge,.clsbadge,.datepill,.lbox,.datebtn,.tab{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .wrap{max-width:1320px;margin:0 auto;}
  header{background:linear-gradient(135deg,#3730A3,#4F46E5);color:#fff;padding:20px 28px;}
  header h1{margin:0;font-size:24px;font-weight:800;}
  header .sub{font-size:13px;opacity:.9;margin-top:4px;}
  .bar{background:#fff;border-bottom:1px solid var(--border);padding:10px 20px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab{padding:8px 16px;border:1px solid var(--border);background:#fff;border-radius:8px 8px 0 0;cursor:pointer;font-size:14px;font-weight:700;color:var(--ink);}
  .tab.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .datebar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;background:#F8FAFC;border-bottom:1px solid var(--border);}
  .datebtn{padding:7px 16px;border:1.5px solid var(--navy);background:#fff;border-radius:22px;cursor:pointer;font-size:13px;font-weight:700;color:var(--navy);}
  .datebtn.on{background:var(--navy);color:#fff;}
  .legendbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 20px;background:#fff;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);}
  .lchip{display:inline-flex;align-items:center;gap:5px;}
  .lbox{width:22px;height:14px;border-radius:3px;border:1.5px solid;}
  .toolbar{padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn.gray{background:#fff;color:var(--ink);border:1px solid var(--border);}
  #sheets{padding:0 20px 30px;}

  .selfstudy{margin:8px 0;padding:8px 14px;background:#F1F5F9;border:1px dashed var(--border);border-radius:8px;color:var(--muted);font-size:13px;font-weight:600;}

  /* 시험배치도 한 장 */
  .sheet{background:#fff;border:1px solid var(--border);border-radius:12px;margin:16px 0;overflow:hidden;}
  .phead{padding:12px 18px;color:#fff;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:800;}
  .phead .clsbadge{background:rgba(255,255,255,.92);color:#1E293B;border-radius:8px;padding:3px 12px;font-size:18px;font-weight:900;}
  .phead .pno{font-size:16px;font-weight:800;opacity:.95;}
  .phead .subj{font-size:29px;font-weight:900;letter-spacing:-.5px;}
  .phead .datepill{background:rgba(255,255,255,.28);border-radius:14px;padding:2px 12px;font-size:13px;}
  .phead .cnt{margin-left:auto;font-size:14px;font-weight:700;}
  .room{position:relative;padding:18px 56px 14px;}
  .podium{margin:0 auto 8px;width:360px;max-width:72%;text-align:center;color:#fff;border-radius:8px;padding:11px;font-weight:900;letter-spacing:1px;font-size:20px;}
  .doorR{position:absolute;right:14px;writing-mode:vertical-rl;font-size:12px;font-weight:800;border:2px dashed;border-radius:6px;padding:8px 4px;background:#fff;}
  .doorL{right:auto;left:14px;}
  .door-front{top:64px;color:#B45309;border-color:#F59E0B;}
  .door-back{bottom:30px;color:#7C3AED;border-color:#A78BFA;}
  .collabels{display:grid;gap:10px;margin-bottom:5px;padding:0 2px;}
  .collabel{text-align:center;font-size:11px;color:var(--muted);font-weight:700;}
  .grid{display:grid;gap:10px;}
  .seat{border:2px solid var(--border);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;position:relative;padding:6px;min-height:78px;}
  .seat .sno{position:absolute;top:4px;left:8px;font-size:11px;color:var(--muted);font-weight:700;}
  .seat .nm{font-size:21px;font-weight:800;line-height:1.1;margin-top:6px;}
  .seat .badge{margin-top:5px;font-size:11px;font-weight:800;border-radius:10px;padding:1px 9px;}
  .seat.no{border-style:dashed;background:#fff;}
  .seat.no .nm{color:#94A3B8;}
  .seat.no .badge{color:#94A3B8;background:#F1F5F9;}
  .seat.gap{border:none;background:transparent;}
  .takerlist{padding:10px 18px 16px;font-size:13px;color:var(--ink);border-top:1px solid #EEF2F7;}
  .takerlist b{color:var(--ink);}

  @media print{
    body{background:#fff;}
    .noprint{display:none!important;}
    .wrap{max-width:none;}
    #sheets{padding:0;}
    @page{size:A4 landscape;margin:7mm;}
    .sheet{border:none;border-radius:0;margin:0;width:283mm;height:188mm;
      break-inside:avoid;overflow:hidden;
      display:flex;flex-direction:column;}
    .sheet + .sheet{break-before:page;}
    .phead{flex:none;padding:8px 18px;}
    .phead .clsbadge{font-size:24px;padding:4px 14px;} .phead .pno{font-size:18px;} .phead .subj{font-size:34px;}
    .room{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:8px 60px 4px;}
    .podium{flex:none;padding:8px;font-size:22px;width:380px;margin:0 auto 6px;}
    .collabels{flex:none;margin-bottom:4px;}
    .collabel{font-size:13px;}
    .grid{flex:1 1 auto;min-height:0;grid-template-rows:repeat(var(--rows),minmax(0,1fr));}
    .seat{min-height:0;}
    .seat.no{opacity:.5;}
    .seat .nm{font-size:30px;margin-top:0;}
    .seat .sno{font-size:13px;}
    .seat .badge{font-size:13px;padding:1px 10px;margin-top:3px;}
    .takerlist{flex:none;font-size:12px;padding:6px 18px 8px;line-height:1.35;}
    .door-front{top:64px;}
  }
</style>
</head>

  </div>
  <div id="sheets"></div>
</div>

const GRID_4=[[19,13,7,1],[20,14,8,2],[21,15,9,3],[22,16,10,4],[23,17,11,5],[24,18,12,6]];
const LBL_4=["19~24번","13~18번","7~12번","1~6번(앞문)"];
// 4반·5반: 25명 이상 학급 배치 예시(27석, 맨 앞줄 양끝 비움)
const GRID_5=[[null,17,11,5,null],[23,18,12,6,1],[24,19,13,7,2],[25,20,14,8,3],[26,21,15,9,4],[27,22,16,10,null]];
const LBL_5=["23~27번","17~22번","11~16번","5~10번","1~4번(앞문)"];
// 교실좌측복도(우측창문) 반: 앞문이 왼쪽 → 좌우 반전
const LEFT_CORRIDOR=['2-6','2-7','2-9'];
function gridFor(cls,n){
  const five=(cls==='2-4'||cls==='2-5');
  let grid=five?GRID_5:GRID_4, labels=five?LBL_5:LBL_4;
  const left=LEFT_CORRIDOR.includes(cls);
  if(left){grid=grid.map(r=>r.slice().reverse());labels=labels.slice().reverse();}
  return {grid,labels,cols:five?5:4,left};
}

function studsOf(cls){return DB[cls].students.slice().sort((a,b)=>a.num-b.num);}

// 한 교시 배치 계산 → {render:bool, seatMap, takerCount, total, subjLabel, color, listHtml}
function buildBoard(cls,period){
  const studs=studsOf(cls); const total=studs.length;
  const {mode,subjects,p}=period;
  let order=[]; // {s, subj, take}
  let subjLabel='', color, listHtml='', takerCount=0;
  if(mode==='common'){
    const sj=subjects[0]; color=COLOR[sj]; subjLabel=lbl(sj);
    order=studs.map(s=>({s,subj:sj,take:true}));
    takerCount=total;
    listHtml='<b>전체 응시('+total+'명)</b> · 공통과목이라 개별 선택자료 없이 전원 번호순 착석';
  } else if(mode==='lang'){
    subjLabel='제2외국어'; color=['#F1F5F9','#475569','#1E293B'];
    order=[];
    subjects.forEach(sj=>{ studs.filter(s=>s.subjects.includes(sj)).forEach(s=>order.push({s,subj:sj,take:true})); });
    studs.filter(s=>!subjects.some(x=>s.subjects.includes(x))).forEach(s=>order.push({s,subj:null,take:false}));
    takerCount=order.filter(o=>o.take).length;
    const by={}; subjects.forEach(x=>by[x]=[]);
    order.forEach(o=>{if(o.subj)by[o.subj].push(o.s.name+'('+o.s.num+'번)');});
    listHtml=subjects.map(x=>by[x].length?('<b style="color:'+COLOR[x][2]+'">'+x+' '+by[x].length+'명</b>: '+by[x].join(', ')):'').filter(Boolean).join('<br>');
  } else { // elective
    const sj=subjects[0]; color=COLOR[sj]; subjLabel=lbl(sj);
    const tak=studs.filter(s=>s.subjects.includes(sj));
    const rest=studs.filter(s=>!s.subjects.includes(sj));
    if(tak.length===0) return {render:false};
    order=tak.map(s=>({s,subj:sj,take:true})).concat(rest.map(s=>({s,subj:sj,take:false})));
    takerCount=tak.length;
    listHtml='<b>응시자 ('+tak.length+'명)</b>: '+tak.map(s=>s.name+'('+s.num+'번)').join(', ');
  }
  const seatMap={}; order.forEach((o,i)=>seatMap[i+1]=o);
  return {render:true,seatMap,takerCount,total,subjLabel,color,listHtml,mode,p,subjects};
}

function renderBoard(cls,date,period){
  const b=buildBoard(cls,period);
  if(!b||!b.render) return {selfstudy:true,p:period.p,label:period.subjects.map(lbl).join('/')};
  const {grid,labels,cols,left}=gridFor(cls,b.total);
  const clsNo=cls.split('-')[1];
  let cells='';
  grid.forEach(row=>row.forEach(sno=>{
    if(sno===null){cells+='<div class="seat gap"></div>';return;}
    const o=b.seatMap[sno];
    if(!o||!o.s){cells+='<div class="seat no"><span class="sno">'+sno+'</span></div>';return;}
    const st=o.s;
    if(o.take){
      const c=COLOR[o.subj]||b.color;
      const badge=(b.mode==='lang')?o.subj:'응시';
      cells+='<div class="seat" style="background:'+c[0]+';border-color:'+c[1]+'"><span class="sno">'+sno+'</span>'
        +'<span class="nm" style="color:'+c[2]+'">'+st.name+'</span>'
        +'<span class="badge" style="background:'+c[1]+';color:#fff">'+badge+'</span></div>';
    } else {
      cells+='<div class="seat no"><span class="sno">'+sno+'</span>'
        +'<span class="nm">'+st.name+'</span><span class="badge">-</span></div>';
    }
  }));
  const labelRow=labels.map(l=>'<div class="collabel">'+l+'</div>').join('');
  const c=b.color;
  const cntTxt=(b.mode==='lang')?('전원 응시 '+b.takerCount+'명 / 재적 '+b.total+'명')
              :('응시 '+b.takerCount+'명 / 재적 '+b.total+'명');
  const podiumTxt=(b.mode==='lang')?'교탁 (제2외국어)':'교탁 ('+b.subjLabel+')';
  return {html:'<div class="sheet">'
    +'<div class="phead" style="background:'+c[1]+'"><span class="clsbadge">2-'+clsNo+'반</span><span class="pno">'+period.p+'교시</span><span class="subj">'+b.subjLabel+'</span>'
    +'<span class="datepill">'+date+'</span><span class="cnt">'+cntTxt+'</span></div>'
    +'<div class="room"><div class="podium" style="background:'+c[1]+'">'+podiumTxt+'</div>'
    +'<div class="doorR door-front'+(left?' doorL':'')+'">앞문</div><div class="doorR door-back'+(left?' doorL':'')+'">뒷문</div>'
    +'<div class="collabels" style="grid-template-columns:repeat('+cols+',1fr)">'+labelRow+'</div>'
    +'<div class="grid" style="grid-template-columns:repeat('+cols+',1fr);--rows:'+grid.length+'">'+cells+'</div></div>'
    +'<div class="takerlist">'+b.listHtml+'</div></div>'};
}

// ===== UI =====
let curClass=CLASSES[0],curDate=0;
function renderTabs(){document.getElementById('classTabs').innerHTML=CLASSES.map(c=>'<div class="tab'+(c===curClass?' on':'')+'" onclick="selClass(\''+c+'\')">'+c+'반</div>').join('');}
function renderDateBar(){document.getElementById('dateBar').innerHTML=SCHEDULE.map((s,i)=>'<div class="datebtn'+(i===curDate?' on':'')+'" onclick="selDate('+i+')">'+s.date+'</div>').join('');}
function renderLegend(){
  const used=[...new Set(SCHEDULE.flatMap(s=>s.periods.flatMap(p=>p.subjects)))];
  document.getElementById('legend').innerHTML='<b style="color:var(--ink)">과목 색상:</b>'+used.map(sj=>{const c=COLOR[sj]||['#eee','#999','#333'];return '<span class="lchip"><span class="lbox" style="background:'+c[0]+';border-color:'+c[1]+'"></span>'+lbl(sj)+'</span>';}).join('');
}
function selClass(c){curClass=c;renderTabs();renderSheets();}
function selDate(i){curDate=i;renderDateBar();renderSheets();}
function renderSheets(){
  const day=SCHEDULE[curDate];let h='';
  day.periods.forEach(per=>{
    const r=renderBoard(curClass,day.date,per);
    if(r.selfstudy) h+='<div class="selfstudy noprint">'+r.p+'교시 — 자기주도 (이 반은 '+r.label+' 미응시)</div>';
    else h+=r.html;
  });
  document.getElementById('sheets').innerHTML=h;
}
function collectPrint(classList){
  let h='';
  classList.forEach(c=>SCHEDULE.forEach(day=>day.periods.forEach(per=>{
    const r=renderBoard(c,day.date,per); if(!r.selfstudy) h+=r.html;
  })));
  return h;
}
function doPrint(h){const old=document.getElementById('sheets').innerHTML;document.getElementById('sheets').innerHTML=h;window.print();document.getElementById('sheets').innerHTML=old;renderSheets();}
function printClass(){doPrint(collectPrint([curClass]));}
function printAll(){doPrint(collectPrint(CLASSES));}

renderTabs();renderDateBar();renderLegend();renderSheets();
</script>
</body>
</html>
