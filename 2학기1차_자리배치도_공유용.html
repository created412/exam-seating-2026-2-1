<title>2학기 1차 선택과목 자리배치도</title>
<style>
  /* Layout: 반 탭 → 날짜 → 교시별 교실 배치도(교탁 위, 앞문은 복도 쪽) + 명단 수정 패널 */
  :root{
    --bg:#EEF2FF; --surface:#FFFFFF; --soft:#F8FAFC; --ink:#1E293B; --muted:#64748B; --border:#CBD5E1;
    --navy:#312E81; --on-navy:#FFFFFF; --head1:#3730A3; --head2:#4F46E5;
    --ok:#15803D; --warn:#B45309; --bad:#B91C1C; --edited:#FEF3C7; --edited-ink:#92400E;
    --font:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#0E1120; --surface:#171B2E; --soft:#12162A; --ink:#E2E8F0; --muted:#94A3B8; --border:#334155;
    --navy:#A5B4FC; --on-navy:#111827; --head1:#312E81; --head2:#4338CA;
    --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; --edited:#422006; --edited-ink:#FCD34D; color-scheme:dark;}}
  :root[data-theme="dark"]{
    --bg:#0E1120; --surface:#171B2E; --soft:#12162A; --ink:#E2E8F0; --muted:#94A3B8; --border:#334155;
    --navy:#A5B4FC; --on-navy:#111827; --head1:#312E81; --head2:#4338CA;
    --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; --edited:#422006; --edited-ink:#FCD34D; color-scheme:dark;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);}
  .wrap{max-width:1320px;margin:0 auto;}
  header{background:linear-gradient(135deg,var(--head1),var(--head2));color:#fff;padding:20px 28px;}
  header h1{margin:0;font-size:24px;font-weight:800;text-wrap:balance;}
  header .sub{font-size:13px;opacity:.92;margin-top:4px;}
  .bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab{position:relative;padding:8px 16px;border:1px solid var(--border);background:var(--surface);border-radius:8px 8px 0 0;cursor:pointer;font-size:14px;font-weight:700;color:var(--ink);font-family:inherit;}
  .tab.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy);}
  .tab .dot{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--warn);}
  .datebar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;background:var(--soft);border-bottom:1px solid var(--border);}
  .datebtn{padding:7px 16px;border:1.5px solid var(--navy);background:var(--surface);border-radius:22px;cursor:pointer;font-size:13px;font-weight:700;color:var(--navy);font-family:inherit;}
  .datebtn.on{background:var(--navy);color:var(--on-navy);}
  .legendbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);}
  .lchip{display:inline-flex;align-items:center;gap:5px;}
  .lbox{width:22px;height:14px;border-radius:3px;border:1.5px solid;}
  .toolbar{padding:12px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .btn{background:var(--navy);color:var(--on-navy);border:none;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn.gray{background:var(--surface);color:var(--ink);border:1px solid var(--border);}
  .btn.danger{background:var(--bad);color:#fff;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  button:focus-visible,input:focus-visible{outline:2px solid var(--navy);outline-offset:2px;}
  .note{font-size:12px;color:var(--muted);}
  .editedtag{font-size:12px;font-weight:700;background:var(--edited);color:var(--edited-ink);border-radius:12px;padding:3px 10px;}
  .status{font-size:13px;font-weight:700;}
  .status.ok{color:var(--ok);} .status.bad{color:var(--bad);}
  #sheets{padding:0 20px 30px;}

  .selfstudy{margin:8px 0;padding:8px 14px;background:var(--soft);border:1px dashed var(--border);border-radius:8px;color:var(--muted);font-size:13px;font-weight:600;}
  .overflow{margin:8px 18px 0;padding:8px 12px;border-radius:8px;background:var(--edited);color:var(--edited-ink);font-size:13px;font-weight:700;}

  .sheet{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin:16px 0;overflow:hidden;}
  .phead{padding:12px 18px;color:#fff;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:800;}
  .phead .clsbadge{background:rgba(255,255,255,.92);color:#1E293B;border-radius:8px;padding:3px 12px;font-size:18px;font-weight:900;}
  .phead .pno{font-size:16px;font-weight:800;opacity:.95;}
  .phead .subj{font-size:29px;font-weight:900;letter-spacing:-.5px;}
  .phead .datepill{background:rgba(255,255,255,.28);border-radius:14px;padding:2px 12px;font-size:13px;}
  .phead .cnt{margin-left:auto;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
  .room{position:relative;padding:18px 56px 14px;}
  .podium{margin:0 auto 8px;width:360px;max-width:72%;text-align:center;color:#fff;border-radius:8px;padding:11px;font-weight:900;letter-spacing:1px;font-size:20px;}
  .doorR{position:absolute;right:14px;writing-mode:vertical-rl;font-size:12px;font-weight:800;border:2px dashed;border-radius:6px;padding:8px 4px;background:var(--surface);}
  .doorL{right:auto;left:14px;}
  .door-front{top:64px;color:#B45309;border-color:#F59E0B;}
  .door-back{bottom:30px;color:#7C3AED;border-color:#A78BFA;}
  .collabels{display:grid;gap:10px;margin-bottom:5px;padding:0 2px;}
  .collabel{text-align:center;font-size:11px;color:var(--muted);font-weight:700;}
  .grid{display:grid;gap:10px;}
  .seat{border:2px solid var(--border);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);position:relative;padding:6px;min-height:78px;min-width:0;}
  .seat .sno{position:absolute;top:4px;left:8px;font-size:11px;color:var(--muted);font-weight:700;}
  .seat .nm{font-size:21px;font-weight:800;line-height:1.1;margin-top:6px;overflow-wrap:anywhere;text-align:center;}
  .seat .badge{margin-top:5px;font-size:11px;font-weight:800;border-radius:10px;padding:1px 9px;}
  .seat.no{border-style:dashed;}
  .seat.gap{border:none;background:transparent;}
  .seat.no .nm{color:var(--muted);}
  .seat.no .badge{color:var(--muted);background:var(--soft);}
  .takerlist{padding:10px 18px 16px;font-size:13px;color:var(--ink);border-top:1px solid var(--border);}

  /* 명단 수정 패널 */
  .editor{margin:0 20px 16px;background:var(--surface);border:2px solid var(--navy);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;}
  .editor h2{margin:0;font-size:18px;}
  .editor .help{font-size:12px;color:var(--muted);line-height:1.5;}
  .tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
  table.ed{border-collapse:collapse;width:100%;font-size:13px;min-width:820px;}
  table.ed th,table.ed td{border-bottom:1px solid var(--border);padding:5px 6px;text-align:center;white-space:nowrap;}
  table.ed th{background:var(--soft);color:var(--muted);font-size:12px;position:sticky;top:0;}
  table.ed tr.out td{opacity:.45;}
  table.ed input[type=number]{width:52px;font:inherit;padding:4px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums;}
  table.ed input[type=text]{width:110px;font:inherit;padding:4px 6px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--ink);}
  table.ed input[type=checkbox]{width:17px;height:17px;}
  .edrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--bad);}

  @media (max-width:640px){
    header{padding:16px;} header h1{font-size:19px;}
    .bar,.datebar,.legendbar,.toolbar{padding-left:16px;padding-right:16px;}
    #sheets{padding:0 12px 24px;} .editor{margin:0 12px 16px;}
    .room{padding:12px 10px;} .doorR{display:none;}
    .grid,.collabels{gap:5px;} .seat{min-height:56px;padding:4px;}
    .seat .nm{font-size:14px;} .seat .badge{font-size:10px;padding:0 6px;}
    .phead .subj{font-size:22px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>

<div class="wrap">
  <header>
    <h1>2026학년도 2학기 1차 정기시험 선택과목 자리배치도</h1>
    <div class="sub">2학년 · 10/13(화)~10/16(금) · 응시자는 앞문(복도) 쪽부터 연속 배치 · 4·5반 27석 배치, 나머지 6X4 · 6·7·9반은 앞문이 왼쪽</div>
  </header>
  <div class="bar"><div class="tabs" id="classTabs"></div></div>
  <div class="datebar" id="dateBar"></div>
  <div class="legendbar" id="legend"></div>

    <button class="btn" id="editBtn" type="button">명단 수정</button>

    <span id="roNote" class="note" hidden></span>

  <section class="editor" id="editor" hidden>
    <h2 id="edTitle">명단 수정</h2>

    <div class="tblwrap"><table class="ed"><thead id="edHead"></thead><tbody id="edBody"></tbody></table></div>
    <div class="edrow">
      <button class="btn gray" id="addBtn" type="button">+ 학생 추가</button>
      <span style="flex:1"></span>
      <button class="btn gray" id="cancelBtn" type="button">취소</button>
      <button class="btn" id="saveBtn" type="button">저장</button>
    </div>
    <div class="edrow" id="resetRow">
      <button class="btn gray" id="resetBtn" type="button">원래 명단으로 되돌리기</button>
      <span class="confirm" id="resetConfirm" hidden>이 반의 수정 내용을 모두 지울까요?
        <button class="btn danger" id="resetYes" type="button">되돌리기</button>
        <button class="btn gray" id="resetNo" type="button">아니요</button></span>
    </div>
  </section>
  <div id="sheets"></div>
</div>

function gridFor(cls){
  const five=(cls==='2-4'||cls==='2-5');
  let grid=five?GRID_5:GRID_4, labels=five?LBL_5:LBL_4;
  const left=LEFT_CORRIDOR.includes(cls);

  return {grid,labels,cols:five?5:4,left,seats:five?27:24};
}

    listHtml='<b>전체 응시('+total+'명)</b> · 공통과목이라 전원 번호순 착석';
  } else {
    const sj=subjects[0]; color=COLOR[sj]; subjLabel=lbl(sj);
    const tak=studs.filter(s=>s.subjects.includes(sj));
    const rest=studs.filter(s=>!s.subjects.includes(sj));
    if(tak.length===0) return {render:false};
    order=tak.map(s=>({s,subj:sj,take:true})).concat(rest.map(s=>({s,subj:sj,take:false})));
    takerCount=tak.length;
    listHtml='<b>응시자 ('+tak.length+'명)</b>: '+tak.map(s=>esc(s.name)+'('+s.num+'번)').join(', ');
  }
  const seatMap={}; order.forEach((o,i)=>seatMap[i+1]=o);
  return {render:true,seatMap,takerCount,total,subjLabel,color,listHtml,mode};
}

function renderBoard(cls,date,period){
  const b=buildBoard(cls,period);
  if(!b.render) return {selfstudy:true,p:period.p,label:period.subjects.map(lbl).join('/')};
  const {grid,labels,cols,left,seats}=gridFor(cls);
  let cells='';
  grid.forEach(row=>row.forEach(sno=>{
    if(sno===null){cells+='<div class="seat gap"></div>';return;}
    const o=b.seatMap[sno];
    if(!o){cells+='<div class="seat no"><span class="sno">'+sno+'</span></div>';return;}
    const st=o.s;
    if(o.take){
      const c=COLOR[o.subj]||b.color;
      cells+='<div class="seat" style="background:'+c[0]+';border-color:'+c[1]+'"><span class="sno" style="color:'+c[2]+'">'+sno+'</span>'
        +'<span class="nm" style="color:'+c[2]+'">'+esc(st.name)+'</span>'
        +'<span class="badge" style="background:'+c[1]+';color:#fff">응시</span></div>';
    } else {
      cells+='<div class="seat no"><span class="sno">'+sno+'</span><span class="nm">'+esc(st.name)+'</span><span class="badge">-</span></div>';
    }
  }));
  const over=b.total>seats?'<div class="overflow">학생 '+b.total+'명이 좌석 '+seats+'석보다 많아 '+(b.total-seats)+'명이 배치도에 표시되지 않습니다.</div>':'';
  const c=b.color;
  return {html:'<div class="sheet">'
    +'<div class="phead" style="background:'+c[1]+'"><span class="clsbadge">'+cls+'반</span><span class="pno">'+period.p+'교시</span><span class="subj">'+b.subjLabel+'</span>'
    +'<span class="datepill">'+date+'</span><span class="cnt">응시 '+b.takerCount+'명 / 재적 '+b.total+'명</span></div>'
    +over
    +'<div class="room"><div class="podium" style="background:'+c[1]+'">교탁 ('+b.subjLabel+')</div>'
    +'<div class="doorR door-front'+(left?' doorL':'')+'">앞문</div><div class="doorR door-back'+(left?' doorL':'')+'">뒷문</div>'
    +'<div class="collabels" style="grid-template-columns:repeat('+cols+',minmax(0,1fr))">'+labels.map(l=>'<div class="collabel">'+l+'</div>').join('')+'</div>'
    +'<div class="grid" style="grid-template-columns:repeat('+cols+',minmax(0,1fr))">'+cells+'</div></div>'
    +'<div class="takerlist">'+b.listHtml+'</div></div>'};
}

// ===== 화면 =====
let curClass=CLASSES[0], curDate=0;
const $=id=>document.getElementById(id);
function fmtTime(iso){ try{const d=new Date(iso);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}catch(e){return '';} }
function renderTabs(){
  $('classTabs').innerHTML=CLASSES.map(c=>'<button type="button" class="tab'+(c===curClass?' on':'')+'" data-cls="'+c+'">'+c+'반'+(OVR[c]?'<span class="dot" title="수정된 명단"></span>':'')+'</button>').join('');
}
function renderDateBar(){ $('dateBar').innerHTML=SCHEDULE.map((s,i)=>'<button type="button" class="datebtn'+(i===curDate?' on':'')+'" data-date="'+i+'">'+s.date+'</button>').join(''); }
function renderLegend(){
  const used=[...new Set(SCHEDULE.flatMap(s=>s.periods.flatMap(p=>p.subjects)))];
  $('legend').innerHTML='<b style="color:var(--ink)">과목 색상:</b>'+used.map(sj=>{const c=COLOR[sj];return '<span class="lchip"><span class="lbox" style="background:'+c[0]+';border-color:'+c[1]+'"></span>'+lbl(sj)+'</span>';}).join('');
}
function renderEditedTag(){
  const o=OVR[curClass];
  $('editedTag').hidden=!o;
  if(o) $('editedTag').textContent='수정된 명단 사용 중'+(o.updatedAt?' · '+fmtTime(o.updatedAt):'');
}
function renderSheets(){
  const day=SCHEDULE[curDate]; let h='';
  day.periods.forEach(per=>{
    const r=renderBoard(curClass,day.date,per);
    h+= r.selfstudy ? '<div class="selfstudy">'+r.p+'교시 — 자기주도 (이 반은 '+r.label+' 응시자 없음)</div>' : r.html;
  });
  $('sheets').innerHTML=h;
}
function renderAll(){ renderTabs(); renderDateBar(); renderEditedTag(); renderSheets(); }

$('classTabs').addEventListener('click',e=>{const b=e.target.closest('[data-cls]'); if(!b)return; curClass=b.dataset.cls; closeEditor(); renderAll();});
$('dateBar').addEventListener('click',e=>{const b=e.target.closest('[data-date]'); if(!b)return; curDate=+b.dataset.date; renderDateBar(); renderSheets();});

// ===== 명단 수정 =====
let draft=null;
function setStatus(msg,kind){ const s=$('status'); s.textContent=msg||''; s.className='status'+(kind?' '+kind:''); }
function openEditor(){
  draft=rosterOf(curClass).map(s=>({num:s.num,name:s.name,subjects:[...s.subjects],out:!!s.out})).sort((a,b)=>a.num-b.num);
  $('edTitle').textContent=curClass+'반 명단 수정';
  $('edHead').innerHTML='<tr><th>번호</th><th>이름</th>'+ELECTIVES.map(s=>'<th>'+SHORTL[s]+'</th>').join('')+'<th>제외(자퇴·전출)</th></tr>';
  renderEditor(); $('editor').hidden=false; $('resetRow').hidden=!OVR[curClass]; $('resetConfirm').hidden=true; setStatus('');
  $('saveBtn').disabled=!db||readOnly;
}
function closeEditor(){ draft=null; $('editor').hidden=true; }
function renderEditor(){
  $('edBody').innerHTML=draft.map((s,i)=>'<tr class="'+(s.out?'out':'')+'">'
    +'<td><input type="number" min="1" max="40" id="num-'+i+'" data-i="'+i+'" data-f="num" value="'+s.num+'" aria-label="번호"></td>'
    +'<td><input type="text" id="name-'+i+'" data-i="'+i+'" data-f="name" value="'+esc(s.name)+'" aria-label="이름"></td>'
    +ELECTIVES.map(sj=>'<td><input type="checkbox" id="sj-'+i+'-'+sj+'" data-i="'+i+'" data-sj="'+sj+'"'+(s.subjects.includes(sj)?' checked':'')+' aria-label="'+SHORTL[sj]+'"></td>').join('')
    +'<td><input type="checkbox" id="out-'+i+'" data-i="'+i+'" data-f="out"'+(s.out?' checked':'')+' aria-label="제외"></td></tr>').join('');
}
$('edBody').addEventListener('input',e=>{
  const t=e.target, i=+t.dataset.i; if(!draft||isNaN(i))return;
  if(t.dataset.f==='num') draft[i].num=parseInt(t.value,10);
  else if(t.dataset.f==='name') draft[i].name=t.value;
});
$('edBody').addEventListener('change',e=>{
  const t=e.target, i=+t.dataset.i; if(!draft||isNaN(i))return;
  if(t.dataset.sj){ const set=new Set(draft[i].subjects); t.checked?set.add(t.dataset.sj):set.delete(t.dataset.sj); draft[i].subjects=[...set]; }
  else if(t.dataset.f==='out'){ draft[i].out=t.checked; t.closest('tr').className=t.checked?'out':''; }
});
$('editBtn').addEventListener('click',()=>{ $('editor').hidden?openEditor():closeEditor(); });
$('cancelBtn').addEventListener('click',()=>{ closeEditor(); setStatus(''); });
$('addBtn').addEventListener('click',()=>{
  const max=draft.reduce((m,s)=>Math.max(m,s.num||0),0);
  draft.push({num:max+1,name:'',subjects:[],out:false}); renderEditor();
  const el=$('name-'+(draft.length-1)); if(el) el.focus();
});
$('saveBtn').addEventListener('click',async()=>{
  if(!draft) return;
  const rows=draft.map(s=>({num:s.num,name:String(s.name||'').trim(),subjects:s.subjects,out:!!s.out}));
  if(rows.some(s=>!Number.isInteger(s.num)||s.num<1)){ setStatus('번호는 1 이상의 숫자로 입력하세요.','bad'); return; }
  if(rows.some(s=>!s.name)){ setStatus('이름이 비어 있는 학생이 있습니다.','bad'); return; }
  const nums=rows.map(s=>s.num); if(new Set(nums).size!==nums.length){ setStatus('같은 번호가 두 명 있습니다. 번호를 확인하세요.','bad'); return; }
  rows.sort((a,b)=>a.num-b.num);
  $('saveBtn').disabled=true; setStatus('저장 중…');
  try{
    await db.doc('classes/'+curClass).set({students:rows,updatedAt:new Date().toISOString()});
    OVR[curClass]={students:rows,updatedAt:new Date().toISOString()};
    closeEditor(); renderAll(); setStatus('저장했습니다. 모든 선생님 화면에 반영됩니다.','ok');
  }catch(err){
    $('saveBtn').disabled=false;
    if(err&&err.code==='invalid_argument'){ readOnly=true; applyAccess(); setStatus('이 페이지의 보기 권한만 있어 저장할 수 없습니다. 페이지 소유자에게 편집 권한을 요청하세요.','bad'); }
    else setStatus('저장하지 못했습니다. 잠시 후 다시 저장해 주세요.','bad');
  }
});
$('resetBtn').addEventListener('click',()=>{ $('resetConfirm').hidden=false; });
$('resetNo').addEventListener('click',()=>{ $('resetConfirm').hidden=true; });
$('resetYes').addEventListener('click',async()=>{
  try{ await db.doc('classes/'+curClass).delete(); delete OVR[curClass]; closeEditor(); renderAll(); setStatus('원래 명단으로 되돌렸습니다.','ok'); }
  catch(err){ setStatus('되돌리지 못했습니다. 잠시 후 다시 시도해 주세요.','bad'); }
});

function applyAccess(){
  const ro = !db || canWrite===false || readOnly;
  $('editBtn').hidden = ro;
  $('roNote').hidden = !ro;
  $('roNote').textContent = !db ? '명단 수정은 claude.ai에 로그인한 상태에서 할 수 있습니다.' : '보기 전용입니다. 수정하려면 페이지 소유자에게 편집 권한을 요청하세요.';
  if(ro) closeEditor();
}

renderLegend(); renderAll(); applyAccess();

(async()=>{
  try{
    db = window.claude ? await window.claude.use('db') : null;
    const user = window.claude ? await window.claude.use('user') : null;
    if(user){ try{ canWrite = await user.can('data.write'); }catch(e){ canWrite=null; } }
  }catch(e){ db=null; }
  applyAccess();
  if(!db) return;
  db.collection('classes').onSnapshot(snap=>{
    const next={};
    snap.docs.forEach(d=>{ const v=d.data(); if(v&&Array.isArray(v.students)) next[d.id]=v; });
    OVR=next;
    renderTabs(); renderEditedTag();
    if(!draft) renderSheets();
  },()=>{});
})();
</script>
